@let chatMessages = messages();
@if (chatMessages !== undefined && chatMessages !== null) {
<ul class="messages">
    @for(message of chatMessages; track message.text) {
    <li class="message" [class.my]="isMy(message)">
        <div class="author">
            <div class="avatar">{{message.authorId.at(14) || "C"}}</div>
        </div>
        <div class="content">
            <p>{{message.text}}</p>
            @if (isSigned(message) | async) {
            <span>✔</span>
            } @else {
            <span>❌</span>
            }
        </div>
    </li>
    }
</ul>
}
