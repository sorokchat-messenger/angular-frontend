<nav class="menu">
    <ul class="list">
        @for(chat of chats(); track chat.id) {
        <li>
            <a class="item" [routerLink]="link(chat.id)" routerLinkActive="_active">
                <app-chats-avatar [chat]="chat" />
                <h4 class="name">{{chat.name}}</h4>
            </a>
        </li>
        }
    </ul>
</nav>
