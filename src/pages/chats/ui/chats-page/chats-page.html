@let currentChat = chat();
<app-chats-sidebar />
<section class="chats">
    @if (currentChat === null) {
    <app-chats-placeholer />
    } @else {
    <div class="chat">
        <app-chat-head [chat]="currentChat" />
        <app-messages-list [chatId]="currentChat.id" />
        <app-send-message [chatId]="currentChat.id" />
    </div>
    }
</section>
