@let currentChat = chat();
<app-chats-sidebar />
<section class="chats">
    @if (currentChat === null) {
    <app-chats-placeholer />
    } @else {
    <div class="chat">
        <app-chat-head [chat]="currentChat" />
        <ul class="messages">
        </ul>
        <app-send-message />
    </div>
    }
</section>
