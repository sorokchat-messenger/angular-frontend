<app-form [form]="form" (send)="create($event)">
    <app-field [field]="form.name()" label="Назва чату" placeholder="Введіть назву чату" />
    <app-field [field]="form.description()" label="Опис чату" placeholder="Введіть опис назву чату" />
    <app-button type="submit">Створити</app-button>
</app-form>
