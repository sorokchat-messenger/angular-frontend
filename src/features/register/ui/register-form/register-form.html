<app-form [form]="form" (send)="register($event)">
    <h1 class="title">Реєстрація</h1>
    <app-field [field]="form.login()" label="Унікальне ім'я" placeholder="Ваше унікальне ім'я..." />
    <app-field [field]="form.password()" type="password" label="Пароль" placeholder="Ваш пароль..." />
    <app-field [field]="form.displayName()" label="Видиме ім'я" placeholder="Ваше видиме ім'я..." />
    <app-button [disabled]="form().invalid()" type="submit" class="button">Зареєструватися</app-button>
    <div class="guide">Якщо вже зареєстровані, <a class="accent" [routerLink]="loginPath">увійдіть</a>.</div>
</app-form>
