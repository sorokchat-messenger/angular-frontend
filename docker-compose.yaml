name: sorokchat
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sorokchat.frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks: 
      - sorokchat
    env_file: .env.production.local
    #volumes:
      #- "./nginx.conf:/etc/nginx/conf.d/default.conf"
networks:
  sorokchat:
    name: sorokchat